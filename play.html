<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play</title>
<style>
  :root { --bg:#0b0e14; --panel:#131926; --panel2:#1a2233; --border:#2a3550; --text:#e8ecf5; --dim:#93a0bd; --good:#4fdc8f; --bad:#ff5f6d; --accent:#4fa8ff; --warn:#e8b93a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#06121f; color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif; overflow:hidden; }
  #status { padding:20px; color:var(--dim); text-align:center; }
  #app { display:none; height:100%; position:relative; }
  #app.ready { display:block; }
  #topbar {
    position:absolute; top:0; left:0; right:0; z-index:20;
    background:rgba(11,14,20,0.9); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px; padding:8px 12px; flex-wrap:wrap; font-size:13px;
  }
  #topbar .spacer { flex:1; }
  #topbar button, #topbar a {
    background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:6px;
    padding:6px 10px; font-size:12px; cursor:pointer; text-decoration:none;
  }
  #topbar .hud-good { color:var(--good); }
  #topbar .hud-bad { color:var(--bad); }
  canvas { display:block; background:#06121f; }
  #sidePanel {
    position:absolute; top:0; right:0; bottom:0; width:340px; max-width:88vw;
    background:rgba(11,14,20,0.95); border-left:1px solid var(--border); z-index:15;
    display:flex; flex-direction:column; transform:translateX(0); transition:transform .2s;
  }
  #sidePanel.collapsed { transform:translateX(100%); }
  #sideTabs { display:flex; border-bottom:1px solid var(--border); }
  #sideTabs button { flex:1; background:var(--panel); color:var(--dim); border:none; padding:10px 4px; font-size:12px; cursor:pointer; border-bottom:2px solid transparent; }
  #sideTabs button.active { color:var(--accent); border-bottom-color:var(--accent); }
  .sideTabContent { display:none; flex:1; overflow-y:auto; padding:10px; }
  .sideTabContent.active { display:block; }
  .buildRow, .techRow {
    background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin-bottom:8px;
  }
  .buildRow .name, .techRow .name { font-size:13px; font-weight:600; margin-bottom:2px; }
  .buildRow .stats, .techRow .desc { font-size:11px; color:var(--dim); margin-bottom:6px; }
  .buildRow button, .techRow button {
    width:100%; background:var(--accent); color:#06121f; border:none; border-radius:5px; padding:6px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .buildRow button:disabled, .techRow button:disabled { background:var(--panel); color:var(--dim); cursor:not-allowed; }
  .techRow.done { opacity:0.5; }
  .techRow.active button { background:var(--warn); }
  #minimapWrap {
    position:absolute; bottom:10px; right:10px; z-index:12; width:160px; height:110px;
    border:1px solid var(--border); border-radius:6px; overflow:hidden; background:#06121f;
  }
  #banner {
    position:absolute; inset:0; z-index:30; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px;
    background:rgba(0,0,0,0.8); text-align:center; padding:20px;
  }
  #banner.show { display:flex; }
  #banner h2 { font-size:30px; margin:0; }
  .sel-ring { }
  #unitInfoBox {
    position:absolute; left:10px; bottom:10px; z-index:12; background:rgba(11,14,20,0.9);
    border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:12px; max-width:220px; display:none;
  }
</style>
</head>
<body>

<div id="status">Loading map…</div>

<div id="app">
  <div id="topbar">
    <strong id="mapTitleLabel">Map</strong>
    <span class="spacer"></span>
    <span id="hudGood" class="hud-good"></span>
    <span id="hudBad" class="hud-bad"></span>
    <span class="spacer"></span>
    <span id="turnLabel"></span>
    <button id="pauseBtn">⏸️ Pause</button>
    <button id="soundBtn">🔈 Sound</button>
    <button id="fogBtn">🌫️ Fog: Off</button>
    <button id="saveBtn">💾 Save</button>
    <label style="background:var(--panel2); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer;">
      📂 Load<input id="loadInput" type="file" accept=".json" style="display:none;">
    </label>
    <button id="downloadBtn">⬇ Download as index.html</button>
    <button id="panelToggleBtn">☰ Menu</button>
  </div>

  <canvas id="canvas"></canvas>

  <div id="unitInfoBox"></div>

  <div id="minimapWrap"><canvas id="minimap" width="160" height="110"></canvas></div>

  <div id="sidePanel">
    <div id="sideTabs">
      <button class="stab active" data-tab="build">Build</button>
      <button class="stab" data-tab="research">Research</button>
      <button class="stab" data-tab="help">Controls</button>
    </div>
    <div class="sideTabContent active" id="tab-build"></div>
    <div class="sideTabContent" id="tab-research"></div>
    <div class="sideTabContent" id="tab-help">
      <p style="font-size:12px; color:var(--dim); line-height:1.6;">
        <strong>Click</strong> one of your own units to select it.<br>
        <strong>Click</strong> empty space to move there.<br>
        <strong>Click</strong> an enemy to attack it.<br>
        A <strong>Mining Ship</strong> parked on your deposit earns resources automatically.<br>
        Research at least one tech to unlock stronger economy/units.<br>
        The match ends when a homeworld's HP reaches 0.
      </p>
    </div>
  </div>

  <div id="banner">
    <h2 id="bannerText"></h2>
    <button id="restartBtn" style="padding:10px 22px; font-size:14px; cursor:pointer;">Play Again</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAJ-zJW3Z25mGucMA-hnO67yn-7Q5VgF1c",
  authDomain: "game-maker-ed014.firebaseapp.com",
  projectId: "game-maker-ed014",
  storageBucket: "game-maker-ed014.firebasestorage.app",
  messagingSenderId: "865333148999",
  appId: "1:865333148999:web:689d470ba6a99e62806062",
};

const statusEl = document.getElementById('status');
const appEl = document.getElementById('app');

// ===========================================================================
// A standalone, self-contained skirmish engine: just the two factions from
// one Game-Maker map, not After Earth's own 20-nation galaxy. Real turn
// timer, real real-time mining economy, a real (trimmed) research tree,
// real build queue, real combat, pause, sound, fog of war, save/load - the
// same KIND of mechanics as After Earth, implemented fresh here rather than
// loading After Earth's own file, so nothing of After Earth is in this game
// except the rules it plays by.
// ===========================================================================

// window.GM_INLINE_CONFIG is set only in a standalone downloaded copy of
// this file (see downloadStandalone() below) - when present, the game runs
// entirely offline with no Firestore call at all.
async function loadConfig() {
  if (window.GM_INLINE_CONFIG) return window.GM_INLINE_CONFIG;
  const mapId = new URLSearchParams(location.search).get('map');
  if (!mapId) throw new Error('No map specified. Open a map from the editor’s "My Maps" list.');
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const snap = await getDoc(doc(db, 'maps', mapId));
  if (!snap.exists()) throw new Error('This map doesn’t exist (it may have been deleted).');
  return snap.data();
}

function loadImage(url) {
  return new Promise((resolve) => {
    if (!url) { resolve(null); return; }
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = url;
  });
}
function loadAudio(url) {
  if (!url) return null;
  const a = new Audio(url);
  a.preload = 'none';
  return a;
}

// ---------------------------------------------------------------------
// A trimmed version of After Earth's own tech tree - same numbers/effects
// for the nodes that make sense with no ground/air/sea class split (every
// custom unit here is just "a unit"), dropped the ones that only make
// sense inside After Earth's own galaxy (Defense Cannon tiers, aircraft-
// only Aerial Superiority, etc).
// ---------------------------------------------------------------------
const TECH_TREE = {
  mining_ops: { name: 'Mining Operations', cost: 300, timeSeconds: 60, prereq: null, effect: 'unlock_mining' },
  improved_extraction: { name: 'Improved Extraction', cost: 500, timeSeconds: 90, prereq: 'mining_ops', effect: 'mining_900' },
  deep_mining: { name: 'Deep Mining', cost: 600, timeSeconds: 120, prereq: 'improved_extraction', effect: 'mining_1200' },
  vessel_plating: { name: 'Vessel Plating', cost: 400, timeSeconds: 90, prereq: null, effect: 'hp_15' },
  warp_drive: { name: 'Warp Drive Calibration', cost: 450, timeSeconds: 100, prereq: null, effect: 'speed_12' },
  extended_sensors: { name: 'Extended Sensors', cost: 350, timeSeconds: 80, prereq: null, effect: 'vision_50' },
  rapid_repair: { name: 'Rapid Repair Crews', cost: 500, timeSeconds: 100, prereq: null, effect: 'regen' },
};

const HOMEWORLD_HP = 1000;
const TURN_SECONDS = 90;
const MOVE_PX_PER_SPEED = 20;
const ATTACK_INTERVAL = 1;
const UNIT_SIZE = 34;
const HOMEWORLD_SIZE = 90;
const AI_TICK_SECONDS = 6; // how often the AI re-evaluates build/research/attack decisions

function freshResearchState() { return { researched: new Set(), active: null }; }

function makeCountry(side, cfg, factionCfg) {
  return {
    side,
    name: factionCfg.name || (side === 'good' ? 'Allied Forces' : 'Hostile Forces'),
    color: factionCfg.color || (side === 'good' ? '#4fdc8f' : '#ff5f6d'),
    homeImg: null,
    resources: 1000,
    hp: HOMEWORLD_HP,
    maxHp: HOMEWORLD_HP,
    x: side === 'good' ? 140 : 0, // bad's x set relative to canvas width once known
    y: 0,
    research: freshResearchState(),
    miningRate: 0, // 0 until mining_ops researched
  };
}

function techBonus(country, effect) {
  return country.research.researched.has(
    Object.keys(TECH_TREE).find((k) => TECH_TREE[k].effect === effect)
  );
}

async function main() {
  let cfg;
  try {
    cfg = await loadConfig();
  } catch (err) {
    statusEl.textContent = err.message;
    return;
  }
  statusEl.textContent = 'Loading art & sound…';

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const minimap = document.getElementById('minimap');
  const mctx = minimap.getContext('2d');

  // The topbar wraps onto a second line on narrower widths (it holds a lot
  // of buttons), so its real height isn't a fixed number - measuring it
  // directly and offsetting the side panel from that avoids the panel's
  // own tabs sitting a few pixels under the (higher z-index) topbar, which
  // silently eats clicks meant for the tabs.
  const topbarEl = document.getElementById('topbar');
  const sidePanelEl = document.getElementById('sidePanel');
  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    sidePanelEl.style.top = topbarEl.offsetHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(topbarEl);

  const [bgImg, goodImg, badImg, resourceImg, miningImg] = await Promise.all([
    loadImage(cfg.backgroundImage),
    loadImage(cfg.factions?.good?.baseImage),
    loadImage(cfg.factions?.bad?.baseImage),
    loadImage(cfg.resource?.image),
    loadImage(cfg.miningUnit?.image),
  ]);
  const unitDefs = cfg.units || [];
  const unitImages = await Promise.all(unitDefs.map((u) => loadImage(u.imageUrl)));

  const sounds = {
    music: loadAudio(cfg.sounds?.music),
    attack: cfg.sounds?.attack,
    buildingDestroyed: cfg.sounds?.buildingDestroyed,
    homeUnderAttack: cfg.sounds?.homeUnderAttack,
    endgame: cfg.sounds?.endgame,
    intro: cfg.sounds?.intro,
  };
  let soundOn = false;
  function playSfx(url) {
    if (!soundOn || !url) return;
    try { new Audio(url).play().catch(() => {}); } catch (e) {}
  }

  document.getElementById('mapTitleLabel').textContent = cfg.name || 'Untitled Map';

  const W = () => canvas.width, H = () => canvas.height;
  const good = makeCountry('good', cfg, cfg.factions?.good || {});
  const bad = makeCountry('bad', cfg, cfg.factions?.bad || {});
  good.homeImg = goodImg; bad.homeImg = badImg;
  good.x = 160; good.y = H() / 2;
  bad.x = W() - 160; bad.y = H() / 2;
  const countries = { good, bad };

  const units = []; // { id, side, type(index into unitDefs, or 'mining'), x,y,hp,maxHp,attack,range,speed,img,selected,orderType,moveTarget,target,alive,attackCooldown }
  let nextUnitId = 1;

  function unitDefFor(index) { return unitDefs[index]; }

  function effectiveStat(country, base, kind) {
    let v = base;
    if (kind === 'hp' && techBonus(country, 'hp_15')) v *= 1.15;
    if (kind === 'speed' && techBonus(country, 'speed_12')) v *= 1.12;
    return v;
  }

  function spawnUnit(side, defIndex, x, y) {
    const country = countries[side];
    const def = unitDefFor(defIndex);
    const u = {
      id: nextUnitId++, side, defIndex, isMiner: false,
      hp: Math.round(effectiveStat(country, def.hp, 'hp')), maxHp: Math.round(effectiveStat(country, def.hp, 'hp')),
      attack: def.attack, range: def.range, speed: effectiveStat(country, def.speed, 'speed'),
      img: unitImages[defIndex], x, y, alive: true, selected: false,
      orderType: null, moveTarget: null, target: null, attackCooldown: Math.random() * ATTACK_INTERVAL,
    };
    units.push(u);
    return u;
  }
  function spawnMiner(side, x, y) {
    const country = countries[side];
    const u = {
      id: nextUnitId++, side, defIndex: -1, isMiner: true,
      hp: 40, maxHp: 40, attack: 0, range: 0, speed: 1.6,
      img: miningImg, x, y, alive: true, selected: false,
      orderType: null, moveTarget: null, target: null, attackCooldown: 0,
      mining: true,
    };
    units.push(u);
    return u;
  }

  // Each side starts with a resource deposit near its homeworld and (once
  // Mining Operations is researched) can build a Mining Ship to work it -
  // same two-step economy as After Earth, just without needing a whole
  // galaxy around it.
  const deposits = {
    good: { x: good.x, y: good.y - 90, size: cfg.resource?.size || 5000 },
    bad: { x: bad.x, y: bad.y - 90, size: cfg.resource?.size || 5000 },
  };

  function livingUnits(side) { return units.filter((u) => u.alive && u.side === side); }
  function nearestEnemy(u) {
    const enemySide = u.side === 'good' ? 'bad' : 'good';
    let best = null, bestDist = Infinity;
    for (const e of livingUnits(enemySide)) {
      if (e.mining) continue; // AI prefers real targets over a miner, mirrors After Earth's own preference logic loosely
      const d = Math.hypot(e.x - u.x, e.y - u.y);
      if (d < bestDist) { best = e; bestDist = d; }
    }
    const home = countries[enemySide];
    const hd = Math.hypot(home.x - u.x, home.y - u.y);
    if (hd < bestDist || !best) best = home;
    return best;
  }

  let gameOver = false, paused = false;

  function combatTick(u, dt) {
    const t = u.target;
    if (!t || (t.hp !== undefined && t.hp <= 0)) { u.target = null; return; }
    const dist = Math.hypot(t.x - u.x, t.y - u.y);
    if (dist > u.range) {
      const sp = u.speed * MOVE_PX_PER_SPEED;
      u.x += (t.x - u.x) / dist * sp * dt;
      u.y += (t.y - u.y) / dist * sp * dt;
    } else {
      u.attackCooldown -= dt;
      if (u.attackCooldown <= 0) {
        u.attackCooldown = ATTACK_INTERVAL;
        t.hp -= u.attack;
        playSfx(sounds.attack);
        if (t.hp <= 0) {
          t.hp = 0;
          if (t.isHome) {
            playSfx(sounds.homeUnderAttack);
          } else {
            t.alive = false;
            playSfx(sounds.buildingDestroyed);
          }
        }
      }
    }
  }

  let turnTimer = TURN_SECONDS;
  let turnNumber = 1;
  let aiTimer = AI_TICK_SECONDS;
  let fogOn = false;

  function aiThink(dt) {
    aiTimer -= dt;
    if (aiTimer > 0) return;
    aiTimer = AI_TICK_SECONDS;
    // Research: pick mining_ops first if affordable & not yet active/done, else a random available node.
    if (!bad.research.active) {
      const options = Object.keys(TECH_TREE).filter((k) => {
        const t = TECH_TREE[k];
        if (bad.research.researched.has(k)) return false;
        if (t.prereq && !bad.research.researched.has(t.prereq)) return false;
        return bad.resources >= t.cost;
      });
      if (options.length) {
        const pick = options.includes('mining_ops') && !bad.research.researched.has('mining_ops') ? 'mining_ops' : options[Math.floor(Math.random() * options.length)];
        startResearch(bad, pick);
      }
    }
    // Build: a mining ship if it has none and can afford one, else the cheapest combat unit it can afford.
    const hasMiner = units.some((u) => u.alive && u.side === 'bad' && u.isMiner);
    if (!hasMiner && bad.research.researched.has('mining_ops') && bad.resources >= 80) {
      spawnMiner('bad', bad.x - 40, bad.y);
      bad.resources -= 80;
    } else if (unitDefs.length) {
      const affordable = unitDefs.map((d, i) => ({ d, i })).filter((x) => bad.resources >= x.d.cost);
      if (affordable.length) {
        const pick = affordable[Math.floor(Math.random() * affordable.length)];
        bad.resources -= pick.d.cost;
        spawnUnit('bad', pick.i, bad.x - 40 + (Math.random() - 0.5) * 60, bad.y + (Math.random() - 0.5) * 60);
      }
    }
  }

  function update(dt) {
    if (paused || gameOver) return;

    // Turn timer (cosmetic pacing, mirrors After Earth's 90s auto-turn feel)
    turnTimer -= dt;
    if (turnTimer <= 0) { turnTimer = TURN_SECONDS; turnNumber++; }

    // Research progress (real time, both sides)
    for (const c of [good, bad]) {
      if (c.research.active) {
        c.research.active.remaining -= dt;
        if (c.research.active.remaining <= 0) {
          c.research.researched.add(c.research.active.id);
          c.research.active = null;
          renderBuildPanel(); renderResearchPanel();
        }
      }
    }

    // Mining income
    for (const side of ['good', 'bad']) {
      const c = countries[side];
      const miner = units.find((u) => u.alive && u.side === side && u.isMiner);
      if (miner) {
        let rate = 600;
        if (techBonus(c, 'mining_900')) rate = 900;
        if (techBonus(c, 'mining_1200')) rate = 1200;
        c.resources += (rate / 3600) * dt;
      }
    }

    aiThink(dt);

    for (const u of units) {
      if (!u.alive) continue;
      if (u.side === 'bad' && !u.isMiner) {
        if (!u.target) u.target = nearestEnemy(u);
        combatTick(u, dt);
      } else if (u.side === 'good' && !u.isMiner) {
        if (u.orderType === 'attack' && u.target) combatTick(u, dt);
        else if (u.orderType === 'move' && u.moveTarget) {
          const dx = u.moveTarget.x - u.x, dy = u.moveTarget.y - u.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 4) { u.orderType = null; u.moveTarget = null; }
          else {
            const sp = u.speed * MOVE_PX_PER_SPEED;
            u.x += dx / dist * sp * dt; u.y += dy / dist * sp * dt;
          }
        }
      }
    }

    if (good.hp <= 0 || bad.hp <= 0) {
      gameOver = true;
      const winner = good.hp <= 0 ? bad : good;
      document.getElementById('bannerText').textContent = `${winner.name} wins!`;
      document.getElementById('banner').classList.add('show');
      playSfx(sounds.endgame);
    }
  }

  // ---------------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------------
  function drawHome(c) {
    const size = HOMEWORLD_SIZE;
    if (c.homeImg) ctx.drawImage(c.homeImg, c.x - size / 2, c.y - size / 2, size, size);
    else { ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(c.x, c.y, size / 2, 0, 7); ctx.fill(); }
    const pct = Math.max(0, c.hp / c.maxHp);
    ctx.fillStyle = '#2a3550'; ctx.fillRect(c.x - size / 2, c.y - size / 2 - 10, size, 5);
    ctx.fillStyle = c.color; ctx.fillRect(c.x - size / 2, c.y - size / 2 - 10, size * pct, 5);
    ctx.fillStyle = c.color; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(c.name, c.x, c.y + size / 2 + 16);
  }
  function drawUnit(u) {
    if (u.selected) {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(u.x, u.y, UNIT_SIZE / 2 + 5, 0, 7); ctx.stroke();
    }
    if (u.img) ctx.drawImage(u.img, u.x - UNIT_SIZE / 2, u.y - UNIT_SIZE / 2, UNIT_SIZE, UNIT_SIZE);
    else { ctx.fillStyle = countries[u.side].color; ctx.beginPath(); ctx.arc(u.x, u.y, UNIT_SIZE / 2, 0, 7); ctx.fill(); }
    const pct = Math.max(0, u.hp / u.maxHp);
    ctx.fillStyle = '#2a3550'; ctx.fillRect(u.x - UNIT_SIZE / 2, u.y - UNIT_SIZE / 2 - 7, UNIT_SIZE, 3);
    ctx.fillStyle = countries[u.side].color; ctx.fillRect(u.x - UNIT_SIZE / 2, u.y - UNIT_SIZE / 2 - 7, UNIT_SIZE * pct, 3);
  }
  function drawDeposit(d) {
    if (resourceImg) ctx.drawImage(resourceImg, d.x - 18, d.y - 18, 36, 36);
  }

  function render() {
    ctx.clearRect(0, 0, W(), H());
    if (bgImg) {
      const scale = Math.max(W() / bgImg.width, H() / bgImg.height);
      const dw = bgImg.width * scale, dh = bgImg.height * scale;
      ctx.drawImage(bgImg, (W() - dw) / 2, (H() - dh) / 2, dw, dh);
    } else { ctx.fillStyle = '#06121f'; ctx.fillRect(0, 0, W(), H()); }

    drawDeposit(deposits.good); drawDeposit(deposits.bad);
    drawHome(good); drawHome(bad);
    for (const u of units) if (u.alive) drawUnit(u);

    // HUD text
    document.getElementById('hudGood').textContent = `${good.name}: ${Math.round(good.hp)} HP · ${Math.round(good.resources)} ${cfg.resource?.name || 'resources'}`;
    document.getElementById('hudBad').textContent = `${bad.name}: ${Math.round(bad.hp)} HP · ${Math.round(bad.resources)} ${cfg.resource?.name || 'resources'}`;
    const mins = Math.floor(Math.max(0, turnTimer) / 60), secs = Math.floor(Math.max(0, turnTimer) % 60);
    document.getElementById('turnLabel').textContent = `Turn ${turnNumber} · next in ${mins}:${String(secs).padStart(2, '0')}`;

    renderMinimap();
  }

  function renderMinimap() {
    mctx.clearRect(0, 0, 160, 110);
    mctx.fillStyle = '#06121f'; mctx.fillRect(0, 0, 160, 110);
    const sx = 160 / W(), sy = 110 / H();
    function within(x, y) {
      if (!fogOn) return true;
      return livingUnits('good').some((u) => Math.hypot(u.x - x, u.y - y) < 260) || Math.hypot(good.x - x, good.y - y) < 400;
    }
    if (within(good.x, good.y)) { mctx.fillStyle = good.color; mctx.beginPath(); mctx.arc(good.x * sx, good.y * sy, 4, 0, 7); mctx.fill(); }
    if (within(bad.x, bad.y)) { mctx.fillStyle = bad.color; mctx.beginPath(); mctx.arc(bad.x * sx, bad.y * sy, 4, 0, 7); mctx.fill(); }
    for (const u of units) {
      if (!u.alive || !within(u.x, u.y)) continue;
      mctx.fillStyle = countries[u.side].color; mctx.fillRect(u.x * sx - 1, u.y * sy - 1, 2, 2);
    }
  }

  // ---------------------------------------------------------------------
  // Player controls: click-select, click-to-move/attack.
  // ---------------------------------------------------------------------
  let selectedUnit = null;
  function canvasPoint(evt) {
    const r = canvas.getBoundingClientRect();
    return { x: (evt.clientX - r.left) * (W() / r.width), y: (evt.clientY - r.top) * (H() / r.height) };
  }
  canvas.addEventListener('click', (evt) => {
    if (gameOver || paused) return;
    const p = canvasPoint(evt);
    const own = livingUnits('good').find((u) => Math.hypot(u.x - p.x, u.y - p.y) < UNIT_SIZE / 2 + 8);
    if (own) {
      if (selectedUnit) selectedUnit.selected = false;
      selectedUnit = own; selectedUnit.selected = true;
      showUnitInfo(own);
      return;
    }
    if (!selectedUnit || !selectedUnit.alive) { hideUnitInfo(); return; }
    const enemy = livingUnits('bad').find((u) => Math.hypot(u.x - p.x, u.y - p.y) < UNIT_SIZE / 2 + 8);
    const enemyHome = Math.hypot(bad.x - p.x, bad.y - p.y) < HOMEWORLD_SIZE / 2 ? bad : null;
    const target = enemy || enemyHome;
    if (target) {
      target.isHome = target === bad;
      selectedUnit.orderType = 'attack'; selectedUnit.target = target; selectedUnit.moveTarget = null;
    } else {
      selectedUnit.orderType = 'move'; selectedUnit.moveTarget = { x: p.x, y: p.y }; selectedUnit.target = null;
    }
  });
  function showUnitInfo(u) {
    const box = document.getElementById('unitInfoBox');
    const def = u.isMiner ? { name: cfg.miningUnit?.name || 'Mining Ship' } : unitDefFor(u.defIndex);
    box.style.display = 'block';
    box.innerHTML = `<strong>${def.name}</strong><br>HP ${Math.round(u.hp)}/${u.maxHp}${u.isMiner ? '' : ` · ATK ${u.attack} · RNG ${u.range} · SPD ${u.speed.toFixed(1)}`}`;
  }
  function hideUnitInfo() { document.getElementById('unitInfoBox').style.display = 'none'; }

  // ---------------------------------------------------------------------
  // Build / Research panels
  // ---------------------------------------------------------------------
  function canAfford(c, cost) { return c.resources >= cost; }

  function renderBuildPanel() {
    const el = document.getElementById('tab-build');
    el.innerHTML = '';
    const minerRow = document.createElement('div');
    minerRow.className = 'buildRow';
    const hasMiner = units.some((u) => u.alive && u.side === 'good' && u.isMiner);
    const minerUnlocked = good.research.researched.has('mining_ops');
    minerRow.innerHTML = `<div class="name">${cfg.miningUnit?.name || 'Mining Ship'}</div><div class="stats">Cost 80 · ${minerUnlocked ? 'earns resources parked on your deposit' : 'requires Mining Operations research'}</div>`;
    const minerBtn = document.createElement('button');
    minerBtn.textContent = hasMiner ? 'Already built' : (minerUnlocked ? 'Build' : 'Locked');
    minerBtn.disabled = hasMiner || !minerUnlocked || !canAfford(good, 80);
    minerBtn.onclick = () => { good.resources -= 80; spawnMiner('good', good.x + 40, good.y); renderBuildPanel(); };
    minerRow.appendChild(minerBtn);
    el.appendChild(minerRow);

    unitDefs.forEach((def, i) => {
      const row = document.createElement('div');
      row.className = 'buildRow';
      row.innerHTML = `<div class="name">${def.name}</div><div class="stats">HP ${def.hp} · ATK ${def.attack} · RNG ${def.range} · SPD ${def.speed} · Cost ${def.cost}</div>`;
      const btn = document.createElement('button');
      btn.textContent = 'Build';
      btn.disabled = !canAfford(good, def.cost);
      btn.onclick = () => {
        good.resources -= def.cost;
        spawnUnit('good', i, good.x + 40 + (Math.random() - 0.5) * 60, good.y + (Math.random() - 0.5) * 60);
        renderBuildPanel();
      };
      row.appendChild(btn);
      el.appendChild(row);
    });
  }

  function startResearch(country, id) {
    const t = TECH_TREE[id];
    if (!t || country.research.active || country.research.researched.has(id)) return;
    if (t.prereq && !country.research.researched.has(t.prereq)) return;
    if (country.resources < t.cost) return;
    country.resources -= t.cost;
    country.research.active = { id, remaining: t.timeSeconds };
  }

  function renderResearchPanel() {
    const el = document.getElementById('tab-research');
    el.innerHTML = '';
    Object.entries(TECH_TREE).forEach(([id, t]) => {
      const row = document.createElement('div');
      const done = good.research.researched.has(id);
      const active = good.research.active && good.research.active.id === id;
      row.className = 'techRow' + (done ? ' done' : '') + (active ? ' active' : '');
      const lockedByPrereq = t.prereq && !good.research.researched.has(t.prereq);
      row.innerHTML = `<div class="name">${t.name}</div><div class="desc">Cost ${t.cost} · ${t.timeSeconds}s${lockedByPrereq ? ' · requires ' + TECH_TREE[t.prereq].name : ''}${active ? ' · researching… ' + Math.ceil(good.research.active.remaining) + 's left' : ''}</div>`;
      const btn = document.createElement('button');
      btn.textContent = done ? 'Done' : (active ? 'In progress' : 'Research');
      btn.disabled = done || !!good.research.active || lockedByPrereq || good.resources < t.cost;
      btn.onclick = () => { startResearch(good, id); renderResearchPanel(); };
      row.appendChild(btn);
      el.appendChild(row);
    });
  }

  // ---------------------------------------------------------------------
  // Top bar controls: pause, sound, fog, save/load, download standalone
  // ---------------------------------------------------------------------
  document.getElementById('pauseBtn').addEventListener('click', () => {
    paused = !paused;
    document.getElementById('pauseBtn').textContent = paused ? '▶️ Resume' : '⏸️ Pause';
  });
  document.getElementById('soundBtn').addEventListener('click', () => {
    soundOn = !soundOn;
    document.getElementById('soundBtn').textContent = soundOn ? '🔊 Sound' : '🔈 Sound';
    if (soundOn && sounds.music) { sounds.music.loop = true; sounds.music.play().catch(() => {}); }
    else if (sounds.music) sounds.music.pause();
  });
  document.getElementById('fogBtn').addEventListener('click', () => {
    fogOn = !fogOn;
    document.getElementById('fogBtn').textContent = fogOn ? '🌫️ Fog: On' : '🌫️ Fog: Off';
  });
  document.querySelectorAll('.stab').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.stab').forEach((b) => b.classList.remove('active'));
      document.querySelectorAll('.sideTabContent').forEach((c) => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    });
  });
  document.getElementById('panelToggleBtn').addEventListener('click', () => {
    document.getElementById('sidePanel').classList.toggle('collapsed');
  });
  document.getElementById('restartBtn').addEventListener('click', () => location.reload());

  function serializeState() {
    return {
      cfg, turnNumber, turnTimer,
      good: { resources: good.resources, hp: good.hp, researched: [...good.research.researched], active: good.research.active },
      bad: { resources: bad.resources, hp: bad.hp, researched: [...bad.research.researched], active: bad.research.active },
      units: units.filter((u) => u.alive).map((u) => ({ side: u.side, defIndex: u.defIndex, isMiner: !!u.isMiner, x: u.x, y: u.y, hp: u.hp, maxHp: u.maxHp })),
    };
  }
  document.getElementById('saveBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(serializeState(), null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (cfg.name || 'game').replace(/[^a-z0-9]+/gi, '-') + '-save.json';
    a.click();
  });
  document.getElementById('loadInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const data = JSON.parse(await file.text());
    good.resources = data.good.resources; good.hp = data.good.hp;
    good.research.researched = new Set(data.good.researched); good.research.active = data.good.active;
    bad.resources = data.bad.resources; bad.hp = data.bad.hp;
    bad.research.researched = new Set(data.bad.researched); bad.research.active = data.bad.active;
    units.length = 0;
    data.units.forEach((u) => {
      const spawned = u.isMiner ? spawnMiner(u.side, u.x, u.y) : spawnUnit(u.side, u.defIndex, u.x, u.y);
      spawned.hp = u.hp; spawned.maxHp = u.maxHp;
    });
    renderBuildPanel(); renderResearchPanel();
  });

  document.getElementById('downloadBtn').addEventListener('click', async () => {
    const html = await fetch(location.pathname).then((r) => r.text());
    const inline = `<script>window.GM_INLINE_CONFIG = ${JSON.stringify(cfg)};<\/script>\n`;
    const withConfig = html.replace('<script type="module">', inline + '<script type="module">');
    const blob = new Blob([withConfig], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'index.html';
    a.click();
  });

  // ---------------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------------
  renderBuildPanel();
  renderResearchPanel();
  statusEl.style.display = 'none';
  appEl.classList.add('ready');

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

main().catch((err) => {
  console.error(err);
  statusEl.textContent = 'Could not load this map: ' + err.message;
});
</script>
</body>
</html>
